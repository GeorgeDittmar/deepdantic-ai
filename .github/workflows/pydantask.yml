name: Publish to PyPI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]


jobs:
  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest 
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" 

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          # Optional: If your tests rely on setup.py/pyproject.toml dependencies:
          python -m pip install . 

      - name: Run pytest
        run: pytest

  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: run-tests

    # CRITICAL CONDITIONAL: Only execute this job if a release was published on the main branch
    if: github.event_name == 'release' && github.event.release.target_commitish == 'main'

    environment:
      name: pypi
      url: https://pypi.org/p/pydantask  # Replace with your package name
    permissions:
      id-token: write  # MANDATORY for Trusted Publishing
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" 

      - name: Install build dependencies
        run: python -m pip install build
        
      - name: Build binary wheel and source tarball
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
